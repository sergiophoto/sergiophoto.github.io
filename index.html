<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Bisonte Firenze - Millenium Brescia</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #000;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    /* Titolo */
    .page-title {
      text-align: center;
      font-size: 1.8rem;
      font-weight: 300;
      margin-top: 2rem;
      margin-bottom: 1rem;
      letter-spacing: 1px;
    }

    /* Logo */
    .main-logo {
      display: block;
      margin: 0 auto;
      width: 180px;
      opacity: 0.9;
      margin-bottom: 2rem;
      pointer-events: none;
      user-select: none;
    }

    /* Loader */
    #loader {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 1s ease;
    }

    #loader.loaded {
      animation: loaderFadeOut 1s ease forwards;
    }

    @keyframes loaderFadeOut {
      to { opacity: 0; visibility: hidden; }
    }

    .loader-logo {
      width: 150px;
      opacity: 0;
      animation: fadeIn 1.5s ease forwards;
      pointer-events: none;
      user-select: none;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* Gallery masonry */
    .gallery {
      column-count: 3;
      column-gap: 1rem;
      padding: 2rem;
    }

    .photo {
      position: relative;
      break-inside: avoid;
      margin-bottom: 1rem;
    }

    /* Migliore gestione foto verticali */
    .photo img:first-child {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 4px;
    pointer-events: none;
    user-select: none;
}

    /* Watermark centrato */
    .watermark {
  position: absolute;
  top: 50%;
  left: 50%;
  width: min(200px, 35%);
  opacity: 0.35;
  transform: translate(-50%, -50%);
  pointer-events: none;
  user-select: none;
}
@media (max-width: 768px) {

.gallery { column-count: 2; padding: 1rem; }

.main-logo { margin-bottom: 1rem; }

.page-title { font-size: 1.2rem; padding: 0 10px; }

.watermark { width: min(120px, 30%); }

}

@media (max-width: 480px) {

.gallery { column-count: 1; }

.watermark { width: min(100px, 25%); }

}  
</style>
